<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="app-header">
      <h1>待辦清單</h1>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切換深淺色模式"></button>
    </header>

    <form class="todo-form" id="todo-form">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        type="text"
        id="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
        maxlength="120"
      >
      <button type="submit">新增</button>
    </form>

    <div class="filters" aria-label="待辦事項篩選">
      <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-button" data-filter="active" aria-pressed="false">未完成</button>
      <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty-message" id="empty-message" role="status" aria-live="polite">還沒有任何待辦事項,新增一個吧!</p>

    <footer class="todo-footer">
      <span id="remaining-count">未完成:0 項</span>
      <button type="button" class="clear-completed-button" id="clear-completed-button" aria-label="清除所有已完成的待辦事項" disabled>清除已完成</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
