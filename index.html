<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <h1>待辦清單</h1>

    <form class="todo-form" id="todo-form">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        type="text"
        id="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
        maxlength="120"
      >
      <button type="submit">新增</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty-message" id="empty-message">還沒有任何待辦事項,新增一個吧!</p>

    <footer class="todo-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
